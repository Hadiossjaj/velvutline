<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Техники продаж 5D — Плавная версия</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #2563eb;
      --accent: #0ea5e9;
      --success: #22c55e;
      --warning: #f59e0b;
    }

    [data-theme="dark"] {
      --bg: #030712;
      --card: rgba(15, 23, 42, 0.88);
      --text: #f1f5f9;
      --muted: #94a3b8;
      --border: rgba(148, 163, 184, 0.14);
      --nav-bg: rgba(3, 7, 18, 0.82);
      --shadow: 0 12px 40px rgba(0,0,0,0.45);
      --modal-bg: rgba(15, 23, 42, 0.96);
    }

    [data-theme="light"] {
      --bg: #f1f5f9;
      --card: rgba(255, 255, 255, 0.95);
      --text: #0f172a;
      --muted: #475569;
      --border: rgba(15, 23, 42, 0.09);
      --nav-bg: rgba(255, 255, 255, 0.92);
      --shadow: 0 12px 40px rgba(0,0,0,0.08);
      --modal-bg: rgba(255, 255, 255, 0.98);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.65;
      overflow-x: hidden;
      transition: background-color 0.35s ease, color 0.35s ease;
      -webkit-font-smoothing: antialiased;
    }

    /* ===== ОПТИМИЗИРОВАННЫЙ КОСМОС (лёгкий) ===== */
    .cosmos {
      position: fixed;
      inset: 0;
      z-index: -10;
      overflow: hidden;
      background: #030712;
      contain: strict;
    }

    [data-theme="light"] .cosmos {
      background: #e0e7ff;
      opacity: 0.7;
    }

    .cosmos-deep {
      position: absolute;
      inset: -10%;
      background:
        radial-gradient(ellipse 80% 50% at 20% 30%, rgba(79, 70, 229, 0.22) 0%, transparent 55%),
        radial-gradient(ellipse 60% 40% at 80% 70%, rgba(14, 165, 233, 0.18) 0%, transparent 50%),
        radial-gradient(ellipse 50% 50% at 50% 50%, rgba(124, 58, 237, 0.12) 0%, transparent 60%);
      transform: translate3d(0,0,0);
      animation: deepMove 40s ease-in-out infinite alternate;
      will-change: transform;
    }

    @keyframes deepMove {
      0%   { transform: translate3d(0, 0, 0) scale(1); }
      100% { transform: translate3d(-2%, 1.5%, 0) scale(1.06); }
    }

    /* Звёзды — один лёгкий слой */
    .stars {
      position: absolute;
      inset: 0;
      background-image:
        radial-gradient(1.5px 1.5px at 10% 20%, #fff, transparent),
        radial-gradient(1.5px 1.5px at 20% 50%, rgba(255,255,255,0.9), transparent),
        radial-gradient(1px 1px at 30% 80%, #fff, transparent),
        radial-gradient(1.5px 1.5px at 40% 30%, rgba(255,255,255,0.8), transparent),
        radial-gradient(1px 1px at 50% 60%, #fff, transparent),
        radial-gradient(1.5px 1.5px at 60% 15%, rgba(255,255,255,0.85), transparent),
        radial-gradient(1px 1px at 70% 75%, #fff, transparent),
        radial-gradient(1.5px 1.5px at 80% 40%, rgba(255,255,255,0.9), transparent),
        radial-gradient(1px 1px at 90% 90%, #fff, transparent),
        radial-gradient(1.5px 1.5px at 15% 70%, rgba(200,220,255,0.8), transparent),
        radial-gradient(1px 1px at 55% 25%, #fff, transparent),
        radial-gradient(1.5px 1.5px at 75% 55%, rgba(255,255,255,0.75), transparent);
      background-size: 100% 100%;
      opacity: 0.7;
      animation: starsDrift 120s linear infinite;
      transform: translate3d(0,0,0);
      will-change: transform;
    }

    @keyframes starsDrift {
      from { transform: translate3d(0, 0, 0); }
      to   { transform: translate3d(0, -4%, 0); }
    }

    /* Одна галактика вместо трёх */
    .galaxy {
      position: absolute;
      width: 85vmax;
      height: 85vmax;
      top: 50%;
      left: 50%;
      margin: -42.5vmax;
      border-radius: 50%;
      background: conic-gradient(
        from 0deg,
        transparent 0deg,
        rgba(99, 102, 241, 0.09) 80deg,
        rgba(168, 85, 247, 0.14) 140deg,
        rgba(56, 189, 248, 0.1) 200deg,
        transparent 280deg
      );
      opacity: 0.55;
      transform: translate3d(0,0,0);
      animation: galaxySpin 100s linear infinite;
      will-change: transform;
      pointer-events: none;
    }

    @keyframes galaxySpin {
      from { transform: translate3d(0,0,0) rotate(0deg); }
      to   { transform: translate3d(0,0,0) rotate(360deg); }
    }

    .cosmos-overlay {
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at center, transparent 30%, rgba(3,7,18,0.5) 100%);
      pointer-events: none;
    }

    [data-theme="light"] .cosmos-overlay {
      background: radial-gradient(ellipse at center, rgba(255,255,255,0.2) 20%, rgba(224,231,255,0.55) 100%);
    }

    /* Отключение тяжёлых анимаций при reduced-motion */
    @media (prefers-reduced-motion: reduce) {
      .cosmos-deep, .stars, .galaxy {
        animation: none !important;
      }
    }

    /* ===== UI ===== */
    .theme-toggle, .tools-btn {
      position: fixed;
      z-index: 200;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      font-size: 1.15rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      transform: translate3d(0,0,0);
    }
    .theme-toggle { top: 14px; right: 14px; }
    .tools-btn { top: 14px; right: 66px; }
    .theme-toggle:hover, .tools-btn:hover {
      transform: translate3d(0,0,0) scale(1.1);
    }

    header {
      padding: 64px 18px 32px;
      text-align: center;
      position: relative;
    }

    .badge {
      display: inline-block;
      background: rgba(34,197,94,0.14);
      color: var(--success);
      padding: 6px 14px;
      border-radius: 50px;
      font-size: 0.86rem;
      font-weight: 500;
      border: 1px solid rgba(34,197,94,0.3);
      margin-bottom: 14px;
    }

    h1 {
      font-size: clamp(1.85rem, 5vw, 3.1rem);
      font-weight: 700;
      margin-bottom: 10px;
      background: linear-gradient(90deg, #60a5fa, #38bdf8, #a78bfa, #60a5fa);
      background-size: 300% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: textShine 7s linear infinite;
    }

    [data-theme="light"] h1 {
      background: linear-gradient(90deg, #1d4ed8, #0284c7, #6d28d9);
      background-size: 300% auto;
      -webkit-background-clip: text;
    }

    @keyframes textShine {
      to { background-position: 300% center; }
    }

    .subtitle {
      font-size: 1.02rem;
      color: var(--muted);
      max-width: 600px;
      margin: 0 auto 20px;
    }

    .progress-wrap {
      max-width: 400px;
      margin: 0 auto 8px;
      background: rgba(30,41,59,0.45);
      border-radius: 30px;
      padding: 3px;
      border: 1px solid var(--border);
    }

    .progress-bar {
      height: 9px;
      border-radius: 20px;
      background: linear-gradient(90deg, #2563eb, #22c55e);
      width: 0%;
      transition: width 0.5s cubic-bezier(0.22, 1, 0.36, 1);
      transform: translate3d(0,0,0);
    }

    .progress-text {
      font-size: 0.84rem;
      color: var(--muted);
      margin-bottom: 16px;
    }

    .top-tools {
      max-width: 920px;
      margin: 0 auto 18px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      padding: 0 14px;
    }

    .search-box {
      flex: 1;
      min-width: 200px;
      max-width: 340px;
      position: relative;
    }

    .search-box input {
      width: 100%;
      padding: 11px 14px 11px 40px;
      border-radius: 11px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      font-size: 0.93rem;
      outline: none;
    }

    .search-box::before {
      content: '🔍';
      position: absolute;
      left: 13px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 0.9rem;
      opacity: 0.65;
      pointer-events: none;
    }

    .tool-btn {
      padding: 10px 14px;
      border-radius: 11px;
      border: 1px solid var(--border);
